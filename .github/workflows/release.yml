# Builds the Windows installer and publishes it (plus latest.yml for the
# in-app updater) to a GitHub Release.
#
# Trigger: any push to main. If electron/package.json's version has no release
# yet, the installer is built and a release named v<version> is created (the
# tag is created from the pushed commit). Pushes where that version is already
# released do nothing. So a release is: bump "version", commit, push.
# Pushing a v* tag by hand still works and must match the package version.
#
# electron-builder only builds here (--publish never); the upload is done by
# action-gh-release, which creates or updates exactly one release per tag.
# electron-builder's own GitHub publisher raced itself on the first release
# and produced two releases for the same tag, which broke the download URL.
# Do not create the release by hand before the workflow runs.
#
# Code signing: when the repository secrets CERTUM_EMAIL and CERTUM_OTP exist
# (Certum SimplySign login + TOTP seed), the build downloads a pinned `ssign`
# and electron/scripts/sign-windows.cjs signs the app exe, the uninstaller and
# the installer; the "Check the installer is signed" step then refuses to
# publish anything whose signature is not valid. Without the secrets the build
# is unsigned, as before. See docs/PUBLIC_RELEASE.md, "Code signing".
name: Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Empty until the Certum certificate is issued and the secrets are set.
      CERTUM_EMAIL: ${{ secrets.CERTUM_EMAIL }}
      CERTUM_OTP: ${{ secrets.CERTUM_OTP }}
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v4
      - name: Decide whether this push is a release
        id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != package version v$v"; exit 1; }
            echo "go=true" >> "$GITHUB_OUTPUT"
          elif gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$v is already released; nothing to do"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$v has no release yet; building"
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.decide.outputs.go == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Install
        if: steps.decide.outputs.go == 'true'
        run: npm ci
      - name: Install the signing tool (ssign, pinned)
        if: steps.decide.outputs.go == 'true' && env.CERTUM_OTP != ''
        shell: pwsh
        run: |
          $url = "https://github.com/Le-Syl21/ssign/releases/download/v0.1.6/ssign-windows-x86_64.zip"
          $expected = "8a2a16738f0e1f368b4640cc6cb53fac8072a38df9334a72a96e071169b730f0"
          $dir = Join-Path $env:RUNNER_TEMP "ssign"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $zip = Join-Path $dir "ssign.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "ssign download hash mismatch: $actual" }
          Expand-Archive $zip -DestinationPath $dir -Force
          Add-Content $env:GITHUB_PATH $dir
          & (Join-Path $dir "ssign.exe") --version
      - name: Build installer
        if: steps.decide.outputs.go == 'true'
        run: npm run dist
      - name: Check the installer is signed
        if: steps.decide.outputs.go == 'true' && env.CERTUM_OTP != ''
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature "release/CS-Fantasy-Toolkit-Setup.exe"
          "Status: $($sig.Status)"
          "Signer: $($sig.SignerCertificate.Subject)"
          "Timestamp: $($sig.TimeStamperCertificate.Subject)"
          if ($sig.Status -ne "Valid") { throw "installer signature is $($sig.Status); refusing to publish" }
          if (-not $sig.TimeStamperCertificate) { throw "installer signature has no timestamp; refusing to publish" }
      - name: Show build output
        if: steps.decide.outputs.go == 'true'
        shell: bash
        run: ls -la release
      - name: Publish release
        if: steps.decide.outputs.go == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.decide.outputs.version }}
          name: v${{ steps.decide.outputs.version }}
          files: |
            electron/release/CS-Fantasy-Toolkit-Setup.exe
            electron/release/CS-Fantasy-Toolkit-Setup.exe.blockmap
            electron/release/latest.yml
          fail_on_unmatched_files: true
          generate_release_notes: true
