# Builds the Windows installer and publishes it (plus latest.yml for the
# in-app updater) to a GitHub Release whenever a version tag is pushed:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The tag must match electron/package.json "version" (electron-builder names
# the release after it). The website's download button points at
# releases/latest/download/CS-Fantasy-Toolkit-Setup.exe, so nothing else
# changes between releases.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Install
        run: npm ci
      - name: Check the tag matches package.json
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != package version v$v"; exit 1; }
      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release
